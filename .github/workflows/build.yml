name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Diagnostic: prints what actually exists upstream, so a version mismatch is
      # immediately visible in the log instead of guessed at.
      - name: Resolve upstream versions
        continue-on-error: true
        env:
          MC: '1.21.11'
        run: |
          pick() { python3 -c "import sys,json;d=json.load(sys.stdin);print(d[:6])"; }

          echo "### Yarn builds for $MC"
          curl -s "https://meta.fabricmc.net/v2/versions/yarn/$MC" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([v['version'] for v in d[:6]])"

          echo "### Latest Fabric Loader"
          curl -s "https://meta.fabricmc.net/v2/versions/loader" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([v['version'] for v in d[:4]])"

          for project in fabric-api cloth-config modmenu; do
            echo "### $project for $MC (fabric)"
            curl -s -G "https://api.modrinth.com/v2/project/$project/version" \
              --data-urlencode "game_versions=[\"$MC\"]" \
              --data-urlencode 'loaders=["fabric"]' \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print([v['version_number'] for v in d[:6]])"
          done

          echo "### Latest Fabric Loom"
          curl -s "https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | tail -8

          # Maven coordinates can differ from the Modrinth version strings, so confirm them too.
          echo "### cloth-config-fabric on maven.shedaniel.me"
          curl -s "https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-fabric/maven-metadata.xml" \
            | grep -oE '<version>21\.11[^<]*</version>' | tail -8

          echo "### modmenu on maven.terraformersmc.com"
          curl -s "https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml" \
            | grep -oE '<version>17[^<]*</version>' | tail -8

      - name: Check translation keys
        run: python3 tools/check_lang.py

      # Diagnostic: the authoritative member names for the version we build against.
      - name: Dump mapped members
        continue-on-error: true
        run: |
          python3 tools/dump_mappings.py \
            "$(grep '^yarn_mappings=' gradle.properties | cut -d= -f2)" \
            EntityRenderState EntityRenderer \
            Entity LivingEntity PlayerEntity \
            MinecraftClient GameOptions \
            ClientPlayNetworkHandler PlayerListEntry \
            StatusEffectInstance Style \
            KeyBinding 'KeyBinding$Category'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # Confirms the lang key convention for keybind categories, which mappings cannot tell us.
      - name: Vanilla keybind category keys
        if: always()
        continue-on-error: true
        run: |
          jar=$(find ~/.gradle/caches/fabric-loom -name '*client*.jar' 2>/dev/null | head -1)
          echo "client jar: ${jar:-not found}"
          if [ -n "$jar" ]; then
            unzip -p "$jar" assets/minecraft/lang/en_us.json \
              | grep -oE '"key\.categor[^"]*"' | sort -u | head -20
          fi

      # Confirms the generic type of the tracked swirl data, which mappings cannot show.
      - name: Inspect tracked effect data
        if: always()
        continue-on-error: true
        run: |
          jar=""
          for candidate in $(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null); do
            if unzip -l "$candidate" 2>/dev/null | grep -q 'net/minecraft/entity/LivingEntity.class'; then
              jar="$candidate"; break
            fi
          done
          echo "named jar: ${jar:-not found}"
          if [ -n "$jar" ]; then
            javap -v -p -classpath "$jar" net.minecraft.entity.LivingEntity \
              | grep -B2 -A3 'POTION_SWIRLS' | grep -E 'POTION_SWIRLS|Signature|descriptor' | head -12
          fi

      - name: List produced jars
        if: always()
        run: ls -la build/libs || echo "no build/libs directory"

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nametag-health-jars
          path: build/libs/*.jar
          if-no-files-found: error
