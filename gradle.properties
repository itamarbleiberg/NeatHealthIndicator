# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Loom — the 1.14 line targets Minecraft 1.21.11.
# Loom 1.14 declares plugin.api-version 9.2.0, so the Gradle wrapper must be 9.2 or newer.
loom_version=1.14-SNAPSHOT

# Minecraft + toolchain. 1.21.11 is the last obfuscated release, so Yarn mappings still apply.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5

# Mod metadata
mod_version=1.4.0
maven_group=dev.kiro
archives_base_name=nametag-health

# Dependencies
fabric_version=0.141.6+1.21.11
cloth_config_version=21.11.153
mod_menu_version=17.0.0
